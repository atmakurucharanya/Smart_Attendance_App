<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <style>
        body {
            font-family: Arial;
            background: #eef4ff;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 400px;
            margin: auto;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #1769aa;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Student Details</h2>

    <form method="POST">
        <label>Student Name</label>
        <input type="text" name="name"
               value="{{ student.name }}" required>

        <label>Roll Number</label>
        <input type="text" name="roll"
               value="{{ student.roll }}" required>

        <label>Class Name</label>
        <input type="text" name="class_name"
               value="{{ student.class_name }}" required>

        <button type="submit">Update Student</button>
    </form>

    <p><a href="/students">Back to Students</a></p>
</div>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #eef4ff;
            font-family: Arial;
            padding: 30px;
        }
        .box {
            background: white;
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccd8e8;
        }
        h1 { color: #1769aa; text-align: center; }
        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 7px;
        }
        button, a {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            cursor: pointer;
        }
        .error { color: red; }
    </style>
</head>
<body>

<div class="box">
    <h1>Add Student</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="name"
               placeholder="Student Name" required>

        <input type="text" name="roll"
               placeholder="Roll Number" required>

        <input type="text" name="class_name"
               placeholder="Class" required>

        <button type="submit">Save Student</button>
    </form>

    <a href="/students">View Students</a>
    <a href="/dashboard">Back to Dashboard</a>
</div>

</body>
</html>
